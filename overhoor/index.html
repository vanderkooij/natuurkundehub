<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overhoorprogramma · NatuurkundeHub</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo/JK_dark.svg">
<script src="/overhoor/data/grootheden.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── LIGHT THEME (default) ── */
:root{
  --bg:#f8f9fa;
  --bg-primary-rgb:248, 249, 250;
  --bg-secondary:#ffffff;
  --bg-card:#ffffff;
  --bg-card-hover:#f0fafb;
  --accent:#0BB5C8;
  --accent-glow:rgba(11,181,200,0.2);
  --accent-secondary:#0BB5C8;
  --accent-amber:#D4923A;
  --accent-amber-glow:rgba(212,146,58,0.15);
  --accent-dim:rgba(11,181,200,0.08);
  --accent-border:rgba(11,181,200,0.2);
  --text:#1A1A2E;
  --text-secondary:#2d2d4a;
  --text-muted:#64748b;
  --border:rgba(11,181,200,0.12);
  --border-solid:#d4e8ec;
  --green:#16a34a;
  --green-dim:rgba(22,163,74,0.1);
  --green-border:rgba(22,163,74,0.3);
  --red:#dc2626;
  --red-dim:rgba(220,38,38,0.1);
  --red-border:rgba(220,38,38,0.3);
  --glow-1:rgba(11,181,200,0.12);
  --glow-2:rgba(212,146,58,0.08);
  --font:'Space Grotesk',sans-serif;
  --mono:'JetBrains Mono',monospace;
}

/* ── DARK THEME ── */
[data-theme="dark"]{
  --bg:#0f1117;
  --bg-primary-rgb:15, 17, 23;
  --bg-secondary:#161b26;
  --bg-card:#1c2333;
  --bg-card-hover:#222b3d;
  --accent:#0BB5C8;
  --accent-glow:rgba(11,181,200,0.25);
  --accent-amber:#D4923A;
  --accent-amber-glow:rgba(212,146,58,0.2);
  --accent-dim:rgba(11,181,200,0.08);
  --accent-border:rgba(11,181,200,0.2);
  --text:#e2e8f0;
  --text-secondary:#94a3b8;
  --text-muted:#64748b;
  --border:rgba(11,181,200,0.08);
  --border-solid:#1e2d44;
  --green:#22c55e;
  --green-dim:rgba(34,197,94,0.12);
  --green-border:rgba(34,197,94,0.3);
  --red:#ef4444;
  --red-dim:rgba(239,68,68,0.12);
  --red-border:rgba(239,68,68,0.3);
  --glow-1:rgba(11,181,200,0.15);
  --glow-2:rgba(212,146,58,0.1);
}

body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}

/* Grid background */
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(11,181,200,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(11,181,200,0.05) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}

/* Ambient glows */
.ambient-glow{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);opacity:0.6;pointer-events:none;z-index:0}
.ambient-glow--cyan{background:var(--glow-1);top:-150px;right:-100px}
.ambient-glow--amber{background:var(--glow-2);bottom:-150px;left:-100px}

/* Theme toggle */
.theme-toggle{
  background:transparent;border:1px solid var(--border-solid);border-radius:8px;
  padding:6px 10px;cursor:pointer;font-size:16px;color:var(--text-muted);
  transition:all .2s;line-height:1;
}
.theme-toggle:hover{border-color:var(--accent-border);color:var(--accent)}

/* ── HEADER ── */
.app-header{
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
  padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  min-height:68px;
}
[data-theme="dark"] .app-header{background:rgba(15,17,23,0.6)}
.header-left{display:flex;align-items:center;gap:12px}
.back-link{color:var(--text-muted);text-decoration:none;font-size:18px;padding:4px 8px;border-radius:6px;transition:all .2s}
.back-link:hover{color:var(--accent);background:var(--accent-dim)}
.app-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-0.3px}
.app-title span{color:var(--accent)}
.tool-name{text-align:center;font-size:clamp(28px,4.5vw,40px);font-weight:700;letter-spacing:-1px;line-height:1;color:var(--text);padding:32px 0 20px;position:relative;z-index:1}
.nav{display:flex;gap:2px}
.nav-btn{
  padding:8px 18px;border-radius:8px;border:none;font-size:13px;font-weight:500;
  cursor:pointer;background:transparent;color:var(--text-muted);
  font-family:var(--font);transition:all .15s;
}
.nav-btn:hover{background:rgba(11,181,200,0.08);color:var(--text)}
.nav-btn.active{background:var(--accent);color:#fff;font-weight:600}

/* ── MAIN ── */
.main{max-width:860px;margin:0 auto;padding:28px 20px;position:relative;z-index:1}
.panel{display:none}.panel.active{display:block}

/* ── SECTION TITLE ── */
.section-title{
  font-size:15px;font-weight:700;color:var(--accent);
  padding-left:12px;border-left:3px solid var(--accent);margin-bottom:18px;letter-spacing:-0.2px;
}
.section-title.amber{color:var(--accent-amber);border-left-color:var(--accent-amber)}

/* ── LEVEL SELECTOR ── */
.level-selector{
  display:inline-flex;gap:0;margin-bottom:22px;border-radius:10px;overflow:hidden;
  border:1.5px solid var(--border-solid);background:var(--bg-secondary);
}
.lv-btn{
  padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;
  background:transparent;color:var(--text-muted);border:none;
  font-family:var(--font);transition:all .15s;
  border-right:1px solid var(--border-solid);
}
.lv-btn:last-child{border-right:none}
.lv-btn:hover{background:var(--accent-dim);color:var(--text)}
.lv-btn.active{background:var(--accent);color:#fff}

/* ── SETTINGS CARDS ── */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.setting-card{
  background:var(--bg-card);border-radius:12px;border:1px solid var(--border-solid);
  padding:18px;transition:border-color .2s;
}
.setting-card:hover{border-color:var(--accent-border)}
.setting-label{
  font-size:11px;font-weight:700;color:var(--accent);margin-bottom:12px;
  text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);
}
.check-row{
  display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:8px;
  cursor:pointer;color:var(--text-secondary);transition:color .15s;
}
.check-row:hover{color:var(--text)}
.check-row input[type=checkbox],.check-row input[type=radio]{
  width:16px;height:16px;cursor:pointer;accent-color:var(--accent);
}
.radio-row{
  display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:8px;
  cursor:pointer;color:var(--text-secondary);transition:color .15s;
}
.radio-row:hover{color:var(--text)}
.radio-row input[type=radio]{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}

/* Category checks */
.settings-full{
  background:var(--bg-card);border-radius:12px;border:1px solid var(--border-solid);
  padding:18px;margin-bottom:16px;
}
.cat-check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:10px}
.cat-btn-row{display:flex;gap:8px;margin:8px 0}
.cat-toggle-btn{
  font-family:var(--mono);font-size:11px;padding:5px 14px;border-radius:6px;
  border:1px solid var(--border-solid);cursor:pointer;
  background:var(--bg-secondary);color:var(--text-muted);transition:all .15s;
}
.cat-toggle-btn:hover{border-color:var(--accent-border);color:var(--accent)}

/* Timer settings */
.timer-settings{display:flex;align-items:center;gap:8px;margin-top:6px;padding-left:26px}
.timer-input{
  width:60px;border:1.5px solid var(--border-solid);border-radius:8px;
  padding:5px 8px;font-size:13px;font-family:var(--font);
  background:var(--bg-secondary);color:var(--text);
}
.timer-input:focus{outline:none;border-color:var(--accent)}

/* ── START BUTTON ── */
.start-btn{
  width:100%;padding:14px;background:var(--accent-amber);color:#fff;border:none;
  border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;
  font-family:var(--font);transition:all .2s;letter-spacing:-0.2px;
}
.start-btn:hover{background:#c07d2a;box-shadow:0 0 24px var(--accent-amber-glow)}

/* ── QUIZ ── */
.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:6px}
.progress-meta .score{color:var(--accent);font-weight:700;font-family:var(--mono)}
.progress-bar{height:4px;background:var(--bg-card);border-radius:3px;margin-bottom:18px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-amber));border-radius:3px;transition:width .4s}

.qcard{
  background:var(--bg-card);border-radius:14px;border:1px solid var(--border-solid);
  padding:28px 24px;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.given-section{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border-solid)}
.given-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-family:var(--mono)}
.given-value{font-size:28px;font-weight:700;color:var(--text);line-height:1.2}
.given-sub{font-size:13px;color:var(--accent);font-weight:600;margin-top:4px}

.ask-section{display:grid;gap:16px}
.ask-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;font-family:var(--mono)}

/* Symbol picker */
.sym-picker{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sym-btn{
  padding:4px 9px;border:1px solid var(--border-solid);border-radius:6px;
  font-size:14px;cursor:pointer;background:var(--bg-secondary);color:var(--text-secondary);
  font-family:var(--font);line-height:1.4;transition:all .15s;
}
.sym-btn:hover{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent)}

/* Input */
.ask-input{
  width:100%;border:2px solid var(--border-solid);border-radius:10px;
  padding:12px 14px;font-size:16px;background:var(--bg-secondary);color:var(--text);
  font-family:var(--font);transition:all .15s;
}
.ask-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.ask-input.correct{border-color:var(--green);background:var(--green-dim)}
.ask-input.wrong{border-color:var(--red);background:var(--red-dim)}

.answer-reveal{font-size:12px;color:var(--text-muted);margin-top:5px}
.answer-reveal strong{color:var(--accent)}

/* MC buttons */
.mc-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.mc-btn{
  padding:12px 16px;border:1.5px solid var(--border-solid);border-radius:10px;
  font-size:14px;cursor:pointer;background:var(--bg-secondary);color:var(--text-secondary);
  font-family:var(--font);text-align:left;line-height:1.3;transition:all .15s;
}
.mc-btn:hover:not(:disabled){border-color:var(--accent-border);background:var(--accent-dim);color:var(--text)}
.mc-btn.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--text);font-weight:600}
.mc-btn.correct{border-color:var(--green);background:var(--green-dim);color:var(--green);font-weight:600}
.mc-btn.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red)}
.mc-btn:disabled{cursor:default;opacity:0.8}

/* Feedback */
.feedback-bar{
  font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;
  margin-bottom:12px;display:none;border-left:4px solid;
}
.feedback-bar.ok{background:var(--green-dim);color:var(--green);border-color:var(--green);display:block}
.feedback-bar.nok{background:var(--red-dim);color:var(--red);border-color:var(--red);display:block}

/* Quiz buttons */
.btn-row{display:flex;gap:10px}
.qbtn{
  flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border-solid);
  font-size:14px;cursor:pointer;background:var(--bg-secondary);color:var(--text-muted);
  font-family:var(--font);font-weight:600;transition:all .15s;
}
.qbtn:hover{border-color:var(--accent-border);color:var(--accent)}
.qbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.qbtn.primary:hover{background:#0999aa}

/* Timer */
.timer-ring-wrap{display:flex;justify-content:flex-end;margin-bottom:-4px}
.timer-ring{width:44px;height:44px}
.timer-text{font-size:13px;font-weight:700;fill:var(--text)}
.timer-bg{fill:none;stroke:var(--border-solid);stroke-width:4}
.timer-arc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .9s linear,stroke .3s}

/* End screen */
.end-screen{
  background:var(--bg-card);border-radius:14px;border:1px solid var(--border-solid);
  padding:40px 28px;text-align:center;
  box-shadow:0 4px 24px rgba(0,0,0,0.3);
}
.end-score{font-size:58px;font-weight:700;color:var(--text);line-height:1}
.end-score span{font-size:28px;color:var(--text-muted)}
.end-pct{font-size:18px;color:var(--accent);font-weight:700;margin-bottom:5px;font-family:var(--mono)}
.end-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.end-badge{
  display:inline-block;background:var(--accent-dim);color:var(--accent);
  font-size:12px;font-weight:700;padding:5px 16px;border-radius:20px;
  margin-bottom:22px;border:1px solid var(--accent-border);font-family:var(--mono);
}
.end-btns{display:flex;gap:10px;max-width:340px;margin:0 auto}
.retry-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--border-solid)}
.retry-label{font-size:13px;color:var(--text-muted);margin-bottom:12px}

/* ── PRESETS ── */
.preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.preset-card{
  background:var(--bg-card);border:1.5px solid var(--border-solid);border-radius:12px;
  padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--font);
  color:var(--text);transition:all .15s;
}
.preset-card:hover{border-color:var(--accent-border);background:var(--bg-card-hover)}
.preset-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.preset-name{font-size:15px;font-weight:700;margin-bottom:4px}
.preset-desc{font-size:12px;color:var(--text-muted);line-height:1.4}
.custom-settings{margin-bottom:16px}
.custom-settings summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--text-muted);padding:6px 2px;user-select:none}
.custom-settings summary:hover,.custom-settings[open] summary{color:var(--accent)}
.custom-settings .settings-grid{margin-top:10px}

/* Feedback hint (bv. nog geen MC-antwoord gekozen) */
.feedback-bar.hint{background:var(--accent-amber-glow);color:var(--accent-amber);border-color:var(--accent-amber);display:block}

/* ── LIJST ── */
.list-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.list-cat{margin-bottom:28px}
.list-cat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.list-cat-head h2{font-size:17px;font-weight:700;letter-spacing:-0.3px;color:var(--text)}
.list-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg-card);border:1px solid var(--border-solid);border-radius:12px;overflow:hidden}
.list-table th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border-solid)}
.list-table td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:14px;color:var(--text-secondary)}
.list-table tr:last-child td{border-bottom:none}
.list-table td.mono{font-family:var(--mono);color:var(--accent);font-size:13px;white-space:nowrap}
.lv-badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.lv-badge.lv-ob{background:var(--accent-dim);color:var(--accent)}
.lv-badge.lv-hv{background:var(--accent-amber-glow);color:var(--accent-amber)}
.lv-badge.lv-vw{background:rgba(139,92,246,0.12);color:#8b5cf6}

@media print{
  body{background:#fff;color:#000}
  body::before,.ambient-glow,.app-header,footer,.no-print{display:none!important}
  .panel{display:none!important}
  #panel-lijst{display:block!important}
  .tool-name{padding:0 0 12px;color:#000}
  .list-table{background:#fff;border-color:#999}
  .list-table th{color:#333;border-color:#999}
  .list-table td{color:#000;border-color:#ccc}
  .list-table td.mono{color:#000}
  .lv-badge{border:1px solid #999;background:#fff!important;color:#000!important}
}

@media(max-width:560px){
  .settings-grid{grid-template-columns:1fr}
  .mc-options{grid-template-columns:1fr}
  .level-selector{display:flex;width:100%}
  .lv-btn{flex:1;text-align:center;padding:9px 6px;font-size:12px}
  .app-header{padding:0 12px}
  .main{padding:20px 12px}
}
</style>
</head>
<body>

<div class="ambient-glow ambient-glow--cyan"></div>
<div class="ambient-glow ambient-glow--amber"></div>

<div class="app-header">
  <div class="header-left">
    <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <img src="../assets/logo/JK_light.svg" alt="JK logo" class="header-logo" style="height:32px;opacity:0.9;">
      <span class="app-title">NatuurkundeHub</span>
    </a>
    <span style="color:var(--text-muted);font-size:15px">›</span>
    <span style="color:var(--text-muted);font-size:15px;font-weight:600">Overhoor</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="theme-toggle" onclick="toggleTheme()" title="Wissel thema" id="theme-btn">🌙</button>
    <div class="nav">
      <button class="nav-btn active" data-panel="settings" onclick="showPanel('settings')">Instellingen</button>
      <button class="nav-btn" data-panel="quiz" onclick="showPanel('quiz')">Oefenen</button>
      <button class="nav-btn" data-panel="lijst" onclick="showPanel('lijst')">Lijst</button>
    </div>
  </div>
</div>

<div class="main">

<h1 class="tool-name">Overhoor</h1>

<!-- SETTINGS PANEL -->
<div class="panel active" id="panel-settings">
  <div class="section-title amber">Kies je niveau</div>
  <div class="level-selector">
    <button class="lv-btn active" data-lv="ob" onclick="setLevel('ob')">Onderbouw</button>
    <button class="lv-btn" data-lv="hv" onclick="setLevel('hv')">Bovenbouw havo</button>
    <button class="lv-btn" data-lv="vw" onclick="setLevel('vw')">Bovenbouw vwo</button>
  </div>

  <div class="section-title amber">Hoe wil je oefenen?</div>
  <div class="preset-grid">
    <button class="preset-card" data-preset="sym" type="button" onclick="setPreset('sym')">
      <div class="preset-name">Symbolen</div>
      <div class="preset-desc">Je ziet de grootheid — typ het symbool</div>
    </button>
    <button class="preset-card" data-preset="eenh" type="button" onclick="setPreset('eenh')">
      <div class="preset-name">Eenheden</div>
      <div class="preset-desc">Je ziet de grootheid — typ het eenheidssymbool</div>
    </button>
    <button class="preset-card active" data-preset="compleet" type="button" onclick="setPreset('compleet')">
      <div class="preset-name">Compleet</div>
      <div class="preset-desc">Je ziet de grootheid — typ symbool én eenheidssymbool</div>
    </button>
    <button class="preset-card" data-preset="omgekeerd" type="button" onclick="setPreset('omgekeerd')">
      <div class="preset-name">Omgekeerd</div>
      <div class="preset-desc">Je ziet symbool en eenheid — welke grootheid is het?</div>
    </button>
  </div>

  <details class="custom-settings" id="custom-settings">
    <summary>Zelf samenstellen (gevorderd)</summary>
    <div class="settings-grid">
      <div class="setting-card">
        <div class="setting-label">Wat krijg je te zien?</div>
        <label class="check-row"><input type="checkbox" id="show-naam" checked onchange="syncCheck('show','naam')"> Grootheid</label>
        <label class="check-row"><input type="checkbox" id="show-sym" onchange="syncCheck('show','sym')"> Symbool</label>
        <label class="check-row"><input type="checkbox" id="show-eenh" onchange="syncCheck('show','eenh')"> Eenheid</label>
        <label class="check-row"><input type="checkbox" id="show-esym" onchange="syncCheck('show','esym')"> Eenheidssymbool</label>
      </div>
      <div class="setting-card">
        <div class="setting-label">Wat moet je invullen?</div>
        <label class="check-row"><input type="checkbox" id="ask-naam" onchange="syncCheck('ask','naam')"> Grootheid</label>
        <label class="check-row"><input type="checkbox" id="ask-sym" checked onchange="syncCheck('ask','sym')"> Symbool</label>
        <label class="check-row"><input type="checkbox" id="ask-eenh" onchange="syncCheck('ask','eenh')"> Eenheid</label>
        <label class="check-row"><input type="checkbox" id="ask-esym" checked onchange="syncCheck('ask','esym')"> Eenheidssymbool</label>
      </div>
    </div>
  </details>

  <div class="settings-grid">
    <div class="setting-card">
      <div class="setting-label">Vraagvorm</div>
      <label class="radio-row"><input type="radio" name="qmode" value="open" checked> Open antwoord</label>
      <label class="radio-row"><input type="radio" name="qmode" value="mc"> Multiple choice</label>
    </div>
    <div class="setting-card">
      <div class="setting-label">Volgorde & timer</div>
      <label class="check-row"><input type="checkbox" id="shuffle" checked> Willekeurige volgorde</label>
      <label class="check-row"><input type="checkbox" id="use-timer"> Tijdslimiet per vraag</label>
      <div class="timer-settings">
        <input type="number" class="timer-input" id="timer-sec" value="15" min="5" max="120">
        <span style="font-size:13px;color:var(--text-muted)">seconden</span>
      </div>
    </div>
  </div>

  <div class="settings-full">
    <div class="setting-label">Welke categorieën?</div>
    <div class="cat-btn-row">
      <button class="cat-toggle-btn" onclick="selectVisibleCats(true)">Alles aan</button>
      <button class="cat-toggle-btn" onclick="selectVisibleCats(false)">Alles uit</button>
    </div>
    <div class="cat-check-grid" id="cat-checks"></div>
  </div>

  <button class="start-btn" onclick="startQuiz()">Starten met oefenen</button>
</div>

<!-- QUIZ PANEL -->
<div class="panel" id="panel-quiz">
  <div id="quiz-area"></div>
</div>

<!-- LIJST PANEL -->
<div class="panel" id="panel-lijst">
  <div class="list-toolbar no-print">
    <div class="level-selector" style="margin-bottom:0">
      <button class="lv-btn active" data-lv="ob" onclick="setLevel('ob')">Onderbouw</button>
      <button class="lv-btn" data-lv="hv" onclick="setLevel('hv')">Bovenbouw havo</button>
      <button class="lv-btn" data-lv="vw" onclick="setLevel('vw')">Bovenbouw vwo</button>
    </div>
    <button class="cat-toggle-btn" onclick="window.print()">🖨 Afdrukken</button>
  </div>
  <div id="list-area"></div>
</div>

</div>

<script>
const FIELDS=['naam','sym','eenh','esym'];
const LABELS={naam:'Grootheid',sym:'Symbool',eenh:'Eenheid',esym:'Eenheidssymbool'};
const SYMBOLS=['Ω','°','µ','·','²','³','⁻¹','⁻²','Δ','λ','ρ','Φ','φ','η','α','β','γ','δ','θ','κ','τ','σ'];


const PRESETS={
  sym:      {show:['naam'],        ask:['sym']},
  eenh:     {show:['naam'],        ask:['esym']},
  compleet: {show:['naam'],        ask:['sym','esym']},
  omgekeerd:{show:['sym','esym'],  ask:['naam']}
};
const LV_LABEL={ob:'OB',hv:'HAVO',vw:'VWO'};

let cats=[];
let currentLevel='ob';
let currentPreset='compleet';
let selectedCats=null; // null = gebruik categorie-defaults
let activeInputId=null;

function uid(){return Math.random().toString(36).slice(2,9)}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function normalize(s,keepCase){
  let v=s.trim().replace(/\s+/g,' ');
  if(!keepCase)v=v.toLowerCase();
  // Let op: 'x' hoort hier NIET bij — dat is ook een grootheidssymbool (plaats)
  v=v.replace(/[·.*×]/g,'·').replace(/\s*·\s*/g,'·');
  // Handle fraction/subscript alternatives
  v=v.replace(/1\/2/g,'½');
  v=v.replace(/\^2/g,'²').replace(/\^3/g,'³').replace(/\^-1/g,'⁻¹').replace(/\^-2/g,'⁻²');
  v=v.replace(/_r/g,'_R'); // w_r → w_R
  return v;
}

function levelsFor(level){
  if(level==='ob')return['ob'];
  if(level==='hv')return['ob','hv'];
  return['ob','hv','vw'];
}

function catHasVisibleRows(cat,level){
  const lv=levelsFor(level);
  return cat.rows.some(r=>lv.includes(r.lv));
}

/* ── Categorie-schema per niveau ──
   Onderbouw gebruikt thematische categorieën (OB_CATS, gegroepeerd op row.obCat);
   bovenbouw gebruikt de formele domeinen (de CATS_DATA-categorieën zelf). */
function isOB(){return currentLevel==='ob';}
function allRows(){return cats.flatMap(c=>c.rows);}
function obCatOf(r){return r.obCat||'overig';}

// [{key,label}] voor het huidige niveau — alleen categorieën die rijen bevatten.
function schemeCats(){
  if(isOB()){
    const present=new Set(allRows().filter(r=>r.lv==='ob').map(obCatOf));
    const known=OB_CATS.filter(o=>present.has(o.key));
    const extra=[...present].filter(k=>!OB_CATS.some(o=>o.key===k))
                            .map(k=>({key:k,label:k==='overig'?'Overig':k}));
    return [...known,...extra];
  }
  return cats.filter(c=>catHasVisibleRows(c,currentLevel)).map(c=>({key:c.key,label:c.label}));
}

// Rijen die bij een categorie-key horen, gefilterd op het huidige niveau.
function rowsForCatKey(key){
  if(isOB())return allRows().filter(r=>r.lv==='ob'&&obCatOf(r)===key);
  const lv=levelsFor(currentLevel);
  const cat=cats.find(c=>c.key===key);
  return cat?cat.rows.filter(r=>lv.includes(r.lv)):[];
}

// Standaard aangevinkt: op onderbouw alles aan, op bovenbouw de def-categorieën.
function catDefaultChecked(key){
  if(isOB())return true;
  const c=cats.find(c=>c.key===key);
  return c?!!c.def:true;
}

function init(){
  cats=CATS_DATA.map(c=>({...c,rows:c.rows.map(r=>({id:uid(),...r}))}));
  restoreSettings();
  renderCatChecks();
}

function setLevel(lv){
  const schemeChanged=isOB()!==(lv==='ob');
  currentLevel=lv;
  document.querySelectorAll('.lv-btn').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv));
  // Onder- en bovenbouw hebben andere categorie-keys: bij wisseling terug naar defaults.
  if(schemeChanged)selectedCats=null;
  renderCatChecks();
  if(document.getElementById('panel-lijst').classList.contains('active'))renderList();
}

function renderCatChecks(){
  const div=document.getElementById('cat-checks');
  div.innerHTML=schemeCats().map(c=>{
    const checked=selectedCats?selectedCats.has(c.key):catDefaultChecked(c.key);
    return `
    <label class="check-row" style="margin-bottom:4px">
      <input type="checkbox" class="cat-chk" value="${c.key}"${checked?' checked':''} onchange="updateSelectedCats()"> ${escHtml(c.label)}
    </label>`;}).join('');
}

function updateSelectedCats(){
  selectedCats=new Set(Array.from(document.querySelectorAll('.cat-chk:checked')).map(c=>c.value));
}

function selectVisibleCats(v){
  document.querySelectorAll('.cat-chk').forEach(c=>c.checked=v);
  updateSelectedCats();
}

function markPreset(name){
  currentPreset=name;
  document.querySelectorAll('.preset-card').forEach(c=>c.classList.toggle('active',c.dataset.preset===name));
}

function setPreset(name){
  const p=PRESETS[name];if(!p)return;
  FIELDS.forEach(f=>{
    document.getElementById('show-'+f).checked=p.show.includes(f);
    document.getElementById('ask-'+f).checked=p.ask.includes(f);
  });
  markPreset(name);
}

function syncCheck(source,field){
  const opposite=source==='show'?'ask':'show';
  const src=document.getElementById(source+'-'+field);
  const opp=document.getElementById(opposite+'-'+field);
  if(src.checked&&opp.checked) opp.checked=false;
  markPreset('custom'); // eigen combinatie: geen preset-kaart meer actief
}

function showPanel(p){
  ['settings','quiz','lijst'].forEach(n=>{
    document.getElementById('panel-'+n).classList.toggle('active',n===p);
  });
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel===p));
  if(p==='settings')renderCatChecks();
  if(p==='lijst')renderList();
  if(p==='quiz'&&!Q.items){
    document.getElementById('quiz-area').innerHTML=`<div class="end-screen">
      <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:10px">Nog geen oefening gestart</div>
      <div class="end-sub">Kies eerst je instellingen en klik op “Starten met oefenen”.</div>
      <div class="end-btns"><button class="qbtn primary" onclick="showPanel('settings')">Naar instellingen</button></div>
    </div>`;
  }
}

/* ── SETTINGS OPSLAAN ── */
function saveSettings(){
  const s={level:currentLevel,preset:currentPreset,
    show:FIELDS.filter(f=>document.getElementById('show-'+f).checked),
    ask:FIELDS.filter(f=>document.getElementById('ask-'+f).checked),
    qmode:document.querySelector('input[name=qmode]:checked').value,
    shuffle:document.getElementById('shuffle').checked,
    useTimer:document.getElementById('use-timer').checked,
    timerSec:document.getElementById('timer-sec').value,
    cats:Array.from(document.querySelectorAll('.cat-chk:checked')).map(c=>c.value)};
  try{localStorage.setItem('nh-overhoor-settings',JSON.stringify(s))}catch(e){}
}

function restoreSettings(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem('nh-overhoor-settings')||'null')}catch(e){}
  if(!s)return;
  if(['ob','hv','vw'].includes(s.level)){
    currentLevel=s.level;
    document.querySelectorAll('.lv-btn').forEach(b=>b.classList.toggle('active',b.dataset.lv===s.level));
  }
  // Alleen categorie-keys overnemen die in het huidige schema bestaan
  // (onder-/bovenbouw gebruiken andere keys, en oude opslag kan verouderd zijn).
  if(Array.isArray(s.cats)){
    const valid=new Set(schemeCats().map(c=>c.key));
    const kept=s.cats.filter(k=>valid.has(k));
    selectedCats=kept.length?new Set(kept):null;
  }
  if(Array.isArray(s.show)&&Array.isArray(s.ask)){
    FIELDS.forEach(f=>{
      document.getElementById('show-'+f).checked=s.show.includes(f);
      document.getElementById('ask-'+f).checked=s.ask.includes(f);
    });
  }
  if(s.preset){
    markPreset(s.preset);
    if(s.preset==='custom')document.getElementById('custom-settings').open=true;
  }
  if(s.qmode){const r=document.querySelector(`input[name=qmode][value="${s.qmode}"]`);if(r)r.checked=true;}
  if(typeof s.shuffle==='boolean')document.getElementById('shuffle').checked=s.shuffle;
  if(typeof s.useTimer==='boolean')document.getElementById('use-timer').checked=s.useTimer;
  if(s.timerSec)document.getElementById('timer-sec').value=s.timerSec;
}

/* ── LIJST ── */
function renderList(){
  document.getElementById('list-area').innerHTML=schemeCats().map(sc=>{
    const rows=rowsForCatKey(sc.key);
    if(!rows.length)return'';
    return `<div class="list-cat">
      <div class="list-cat-head"><h2>${escHtml(sc.label)}</h2>
        <button class="cat-toggle-btn no-print" onclick="practiceCat('${sc.key}')">Oefen deze categorie →</button></div>
      <table class="list-table">
        <thead><tr><th>Grootheid</th><th>Symbool</th><th>Eenheid</th><th>Eenheidssymbool</th><th>Niveau</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${escHtml((r.naam||'').split(';')[0].trim())}</td>
          <td class="mono">${escHtml(displayVal(r.sym))}</td>
          <td>${escHtml(displayVal(r.eenh))}</td>
          <td class="mono">${escHtml(displayVal(r.esym))}</td>
          <td><span class="lv-badge lv-${r.lv}">${LV_LABEL[r.lv]}</span></td>
        </tr>`).join('')}</tbody>
      </table></div>`;
  }).join('');
}

function practiceCat(key){
  selectedCats=new Set([key]);
  renderCatChecks();
  startQuiz();
}

// ── QUIZ LOGIC ──

let Q={};let timerInt=null;let mcAnswers={};

function activeRowsForQuiz(){
  const checked=Array.from(document.querySelectorAll('.cat-chk:checked')).map(c=>c.value);
  return checked.flatMap(k=>rowsForCatKey(k));
}
function allPoolRows(){return cats.flatMap(c=>c.rows);}
function levelPoolRows(){const lv=levelsFor(currentLevel);return cats.flatMap(c=>c.rows.filter(r=>lv.includes(r.lv)));}

function startQuiz(){
  const shown=FIELDS.filter(f=>document.getElementById('show-'+f).checked);
  const asked=FIELDS.filter(f=>document.getElementById('ask-'+f).checked);
  if(!shown.length||!asked.length){alert('Kies minimaal één veld om te tonen en één om te vragen.');return}
  const mode=document.querySelector('input[name=qmode]:checked').value;
  const useTimer=document.getElementById('use-timer').checked;
  const timerSec=parseInt(document.getElementById('timer-sec').value)||15;
  let rows=activeRowsForQuiz().filter(r=>shown.some(f=>r[f])&&asked.some(f=>r[f]));
  if(!rows.length){alert('Geen grootheden gevonden voor deze selectie. Pas je instellingen aan.');return}
  if(document.getElementById('shuffle').checked)rows=rows.sort(()=>Math.random()-.5);
  saveSettings();
  Q={items:rows,idx:0,score:0,wrong:[],checked:false,shown,asked,mode,useTimer,timerSec,retrying:false};
  showPanel('quiz');renderCard();
}

function displayVal(raw){return(raw||'').split(';')[0].trim();}

function symPickerHTML(inputId){
  return `<div class="sym-picker" id="sp-${inputId}">${SYMBOLS.map(s=>`<button class="sym-btn" type="button" tabindex="-1" onclick="activeInputId='${inputId}';insertSymbol('${s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">${escHtml(s)}</button>`).join('')}</div>`;
}

function insertSymbol(sym){
  const inp=document.getElementById(activeInputId);if(!inp)return;
  const s=inp.selectionStart,e=inp.selectionEnd;
  inp.value=inp.value.slice(0,s)+sym+inp.value.slice(e);
  inp.selectionStart=inp.selectionEnd=s+sym.length;
  inp.focus();inp.dispatchEvent(new Event('input'));
}

function renderCard(){
  clearInterval(timerInt);
  const area=document.getElementById('quiz-area');
  const list=Q.items;
  if(Q.idx>=list.length){showEnd();return}
  const row=list[Q.idx];
  const pct=Math.round(Q.idx/list.length*100);
  const timerHTML=Q.useTimer?`<div class="timer-ring-wrap"><svg class="timer-ring" viewBox="0 0 44 44"><circle class="timer-bg" cx="22" cy="22" r="18"/><circle class="timer-arc" id="tarc" cx="22" cy="22" r="18" stroke-dasharray="113" stroke-dashoffset="0"/><text class="timer-text" x="22" y="27" text-anchor="middle" id="ttext">${Q.timerSec}</text></svg></div>`:'';
  const shownItems=Q.shown.filter(f=>row[f]);
  const mainField=shownItems[0];
  const subFields=shownItems.slice(1);
  let askHTML='';
  if(Q.mode==='open'){
    askHTML=Q.asked.filter(f=>row[f]).map(f=>{
      const iid='qi-'+f;
      return `<div class="ask-item"><label class="ask-label" for="${iid}">${LABELS[f]}</label><input class="ask-input" id="${iid}" autocomplete="off" spellcheck="false" placeholder="Typ hier..." onfocus="activeInputId='${iid}'" onkeydown="if(event.key==='Enter')checkAnswer()">${symPickerHTML(iid)}</div>`;
    }).join('');
  } else {
    askHTML=Q.asked.filter(f=>row[f]).map(f=>{
      const primary=displayVal(row[f]);
      // Afleiders bij voorkeur uit het actieve niveau; vul aan uit de hele pool als dat te weinig oplevert
      const lvPool=[...new Set(levelPoolRows().map(r=>displayVal(r[f])).filter(v=>v&&!checkValue(v,row[f],f)))];
      const pool=lvPool.length>=3?lvPool:[...new Set(allPoolRows().map(r=>displayVal(r[f])).filter(v=>v&&!checkValue(v,row[f],f)))];
      const opts=[primary,...pool.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
      return `<div class="ask-item"><label class="ask-label">${LABELS[f]}</label><div class="mc-options" id="mc-${f}">${opts.map((o,i)=>`<button class="mc-btn" type="button" onclick="selectMC('${f}',${i})">${escHtml(o)}</button>`).join('')}</div></div>`;
    }).join('');
  }
  area.innerHTML=`
    <div class="progress-meta"><span>${Q.retrying?'Herhaling fouten':'Vraag'} ${Q.idx+1} / ${list.length}</span><span class="score">Score: ${Q.score}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${timerHTML}
    <div class="qcard">
      <div class="given-section">
        <div class="given-label">${LABELS[mainField]}</div>
        <div class="given-value">${escHtml(displayVal(row[mainField]))}</div>
        ${subFields.map(f=>`<div class="given-sub">${LABELS[f]}: ${escHtml(displayVal(row[f]))}</div>`).join('')}
      </div>
      <div class="ask-section">${askHTML}</div>
    </div>
    <div class="feedback-bar" id="feedback"></div>
    <div class="btn-row">
      <button class="qbtn" id="btn-skip" onclick="skipCard()">Weet ik niet</button>
      <button class="qbtn primary" id="btn-check" onclick="checkAnswer()">Controleer</button>
    </div>`;
  if(Q.mode==='open'){const f=Q.asked.find(f=>row[f]);if(f){const el=document.getElementById('qi-'+f);if(el){el.focus();activeInputId='qi-'+f;}}}
  if(Q.useTimer)startTimer();
}

function selectMC(field,idx){
  if(Q.checked)return;
  mcAnswers[field]=idx;
  document.querySelectorAll(`#mc-${field} .mc-btn`).forEach((b,i)=>b.classList.toggle('selected',i===idx));
}

function checkValue(given,correctRaw,field){
  // Symbolen zijn hoofdlettergevoelig (v ≠ V, pa ≠ Pa); namen en eenheidsnamen niet.
  const cs=field==='sym'||field==='esym';
  const canon=t=>{
    let v=normalize(t,cs);
    // Alleen bij eenheden mag een losse 'x' als maalteken gelden (kg x m/s)
    if(field==='eenh'||field==='esym')v=v.replace(/(?<![a-zA-Z])[xX](?![a-zA-Z])/g,'·');
    return v.replace(/·/g,' ').replace(/\s+/g,' ').trim();
  };
  const g=canon(given);
  if(!g)return false;
  let variants=(correctRaw||'').split(';');
  if(field==='naam')variants=variants.flatMap(x=>x.split('/'));
  return variants.map(x=>canon(x)).some(v=>v&&v===g);
}

function startTimer(){
  let left=Q.timerSec;
  const update=()=>{
    const arc=document.getElementById('tarc');const txt=document.getElementById('ttext');
    if(!arc)return;
    arc.style.strokeDashoffset=113*(1-left/Q.timerSec);
    arc.style.stroke=left<=5?'var(--red)':'var(--accent)';
    txt.textContent=left;
    if(left<=0){clearInterval(timerInt);skipCard();}
    left--;
  };
  update();timerInt=setInterval(update,1000);
}

function revealHTML(correctRaw){
  const variants=(correctRaw||'').split(';').map(x=>x.trim()).filter(Boolean);
  return `Antwoord: <strong>${escHtml(variants[0]||'')}</strong>`+(variants.length>1?` <span style="color:var(--text-muted);font-size:11px">(ook: ${escHtml(variants.slice(1).join(', '))})</span>`:'');
}

function checkAnswer(){
  clearInterval(timerInt);
  if(Q.checked){nextCard();return}
  const row=Q.items[Q.idx];if(!row)return;
  const fields=Q.asked.filter(f=>row[f]);
  // MC: eerst overal een antwoord kiezen — voorkomt onbedoeld fout rekenen
  if(Q.mode==='mc'&&fields.some(f=>mcAnswers[f]===undefined)){
    const fb=document.getElementById('feedback');
    fb.textContent='Kies eerst bij elke vraag een antwoord (of klik “Weet ik niet”).';
    fb.className='feedback-bar hint';
    if(Q.useTimer)startTimer();
    return;
  }
  let allOk=true;
  if(Q.mode==='open'){
    fields.forEach(f=>{
      const inp=document.getElementById('qi-'+f);if(!inp)return;
      const ok=checkValue(inp.value,row[f],f);
      inp.classList.toggle('correct',ok);inp.classList.toggle('wrong',!ok);inp.readOnly=true;
      document.getElementById('sp-qi-'+f)?.remove();
      if(!ok){allOk=false;const d=document.createElement('div');d.className='answer-reveal';d.innerHTML=revealHTML(row[f]);inp.after(d);}
    });
  } else {
    fields.forEach(f=>{
      const selIdx=mcAnswers[f];
      document.querySelectorAll(`#mc-${f} .mc-btn`).forEach((b,i)=>{
        const isCorrect=checkValue(b.textContent,row[f],f);
        b.disabled=true;
        if(isCorrect)b.classList.add('correct');
        else if(i===selIdx&&!isCorrect){b.classList.add('wrong');allOk=false;}
      });
    });
  }
  if(allOk)Q.score++;else Q.wrong.push(row);
  const fb=document.getElementById('feedback');
  fb.textContent=allOk?'Goed!':'Niet correct.';fb.className='feedback-bar '+(allOk?'ok':'nok');
  Q.checked=true;document.getElementById('btn-check').textContent='Volgende';document.getElementById('btn-skip').style.display='none';mcAnswers={};
}

function skipCard(){
  clearInterval(timerInt);if(Q.checked){nextCard();return}
  const row=Q.items[Q.idx];if(!row)return;
  Q.asked.filter(f=>row[f]).forEach(f=>{
    if(Q.mode==='open'){
      const inp=document.getElementById('qi-'+f);
      if(inp){inp.classList.add('wrong');inp.readOnly=true;document.getElementById('sp-qi-'+f)?.remove();const d=document.createElement('div');d.className='answer-reveal';d.innerHTML=revealHTML(row[f]);inp.after(d);}
    } else {
      document.querySelectorAll(`#mc-${f} .mc-btn`).forEach(b=>{b.disabled=true;if(checkValue(b.textContent,row[f],f))b.classList.add('correct');});
    }
  });
  Q.wrong.push(row);
  const fb=document.getElementById('feedback');fb.textContent='Overgeslagen.';fb.className='feedback-bar nok';
  Q.checked=true;document.getElementById('btn-check').textContent='Volgende';document.getElementById('btn-skip').style.display='none';mcAnswers={};
}

function nextCard(){Q.idx++;Q.checked=false;renderCard();}

/* Toetsenbord: Enter = controleer/volgende, 1–4 = MC-optie kiezen */
document.addEventListener('keydown',e=>{
  if(!document.getElementById('panel-quiz').classList.contains('active'))return;
  if(!Q.items||Q.idx>=Q.items.length)return;
  const tag=e.target&&e.target.tagName;
  if(e.key==='Enter'&&tag!=='INPUT'&&tag!=='BUTTON'){e.preventDefault();checkAnswer();return;}
  if(Q.mode==='mc'&&!Q.checked&&/^[1-4]$/.test(e.key)&&tag!=='INPUT'){
    const row=Q.items[Q.idx];
    const fields=Q.asked.filter(f=>row[f]);
    const f=fields.find(x=>mcAnswers[x]===undefined)||fields[fields.length-1];
    const btns=document.querySelectorAll(`#mc-${f} .mc-btn`);
    const i=parseInt(e.key,10)-1;
    if(btns[i])selectMC(f,i);
  }
});

function showEnd(){
  clearInterval(timerInt);
  const total=Q.items.length;
  const pct=Math.round(Q.score/total*100);
  const msg=pct>=90?'Uitstekend!':pct>=70?'Goed gedaan!':pct>=50?'Blijf oefenen!':'Nog veel te leren!';
  const wc=Q.wrong.length;
  // Fouten blijven herhaalbaar totdat alles goed is
  const retryHTML=wc>0?`<div class="retry-section"><div class="retry-label">${wc} ${wc>1?'vragen':'vraag'} fout. Wil je die herhalen?</div><button class="qbtn primary" onclick="retryWrong()">Fouten herhalen (${wc})</button></div>`:'';
  document.getElementById('quiz-area').innerHTML=`<div class="end-screen">
    <div style="font-size:22px;font-weight:700;color:var(--text);margin-bottom:16px">${msg}</div>
    <div class="end-score">${Q.score}<span>/${total}</span></div>
    <div class="end-pct">${pct}%</div><div class="end-sub">correct beantwoord</div>
    <div class="end-badge">${Q.retrying?'Herhaling voltooid':'Ronde afgerond'}</div>
    <div class="end-btns"><button class="qbtn" onclick="showPanel('settings')">Instellingen</button><button class="qbtn primary" onclick="startQuiz()">Opnieuw</button></div>
    ${retryHTML}</div>`;
}

function retryWrong(){
  Q={...Q,items:[...Q.wrong].sort(()=>Math.random()-.5),wrong:[],idx:0,score:0,checked:false,retrying:true};
  renderCard();
}

// ── THEME ──
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const logo = document.querySelector('.header-logo');
  const footerLogo = document.querySelector('.footer-logo');
  const btn = document.getElementById('theme-btn');
  if(theme === 'dark'){
    if(logo) logo.src = '../assets/logo/JK_dark.svg';
    if(footerLogo) footerLogo.src = '../assets/logo/JK_white.svg';
    if(btn) btn.textContent = '☀️';
  } else {
    if(logo) logo.src = '../assets/logo/JK_light.svg';
    if(footerLogo) footerLogo.src = '../assets/logo/JK_black.svg';
    if(btn) btn.textContent = '🌙';
  }
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('nh-theme', next);
  applyTheme(next);
}

// Init theme: localStorage > systeemvoorkeur > light
(function(){
  const saved = localStorage.getItem('nh-theme');
  if(saved){
    applyTheme(saved);
  } else if(window.matchMedia('(prefers-color-scheme: dark)').matches){
    applyTheme('dark');
  } else {
    applyTheme('light');
  }
})();

init();
</script>
