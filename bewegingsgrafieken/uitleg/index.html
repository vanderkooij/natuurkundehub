<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f8f9fa;--bg-primary-rgb:248,249,250;--bg-secondary:#ffffff;--bg-card:#ffffff;--bg-card-hover:#f0fafb;
  --accent:#0BB5C8;--accent-glow:rgba(11,181,200,0.2);--accent-amber:#D4923A;--accent-amber-glow:rgba(212,146,58,0.15);
  --accent-dim:rgba(11,181,200,0.08);--accent-border:rgba(11,181,200,0.2);
  --text:#1A1A2E;--text-secondary:#2d2d4a;--text-muted:#64748b;
  --border:rgba(11,181,200,0.12);--border-solid:#d4e8ec;
  --amber-dim:rgba(212,146,58,0.06);--amber-border:rgba(212,146,58,0.2);
  --glow-1:rgba(11,181,200,0.12);--glow-2:rgba(212,146,58,0.08);
  --font:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;--radius:14px;
}
[data-theme="dark"]{
  --bg:#0f1117;--bg-primary-rgb:15,17,23;--bg-secondary:#161b26;--bg-card:#1c2333;--bg-card-hover:#222b3d;
  --accent-glow:rgba(11,181,200,0.25);--accent-amber-glow:rgba(212,146,58,0.2);
  --accent-dim:rgba(11,181,200,0.08);--accent-border:rgba(11,181,200,0.2);
  --text:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;
  --border:rgba(11,181,200,0.08);--border-solid:#1e2d44;
  --amber-dim:rgba(212,146,58,0.09);--amber-border:rgba(212,146,58,0.25);
  --glow-1:rgba(11,181,200,0.15);--glow-2:rgba(212,146,58,0.1);
}

body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(11,181,200,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(11,181,200,0.05) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
.ambient-glow{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);opacity:0.6;pointer-events:none;z-index:0}
.ambient-glow--cyan{background:var(--glow-1);top:-150px;right:-100px}
.ambient-glow--amber{background:var(--glow-2);bottom:-150px;left:-100px}

.theme-toggle{background:transparent;border:1px solid var(--border-solid);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;color:var(--text-muted);transition:all .2s;line-height:1}
.theme-toggle:hover{border-color:var(--accent-border);color:var(--accent)}
.app-header{background:rgba(var(--bg-primary-rgb),0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 32px;display:flex;align-items:center;justify-content:space-between;min-height:68px}
.header-left{display:flex;align-items:center;gap:12px}
.app-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-0.3px;text-decoration:none}
.app-title span{color:var(--accent)}
.crumb{color:var(--text-muted);font-size:15px;font-weight:600;text-decoration:none}
.crumb-sep{color:var(--text-muted);font-size:15px}
.tool-name{text-align:center;font-size:clamp(28px,4.5vw,40px);font-weight:700;letter-spacing:-1px;line-height:1;color:var(--text);padding:32px 0 6px;position:relative;z-index:1}
.tool-sub{text-align:center;font-size:15px;color:var(--text-muted);padding-bottom:8px;position:relative;z-index:1}

.main{max-width:860px;margin:0 auto;padding:24px 20px 80px;position:relative;z-index:1}

.spoor-keuze{display:flex;justify-content:center;margin:0 auto 18px;background:var(--bg-card);border:1px solid var(--border-solid);border-radius:12px;padding:4px;width:max-content;max-width:100%}
.spoor-btn{font-family:var(--font);font-size:14px;font-weight:700;padding:9px 20px;border-radius:9px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s}
.spoor-btn:hover{color:var(--accent)}
.spoor-btn.active{background:var(--accent);color:#fff}

.progress-track{height:6px;background:var(--accent-dim);border:1px solid var(--border-solid);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-amber));transition:width .35s ease}
.steps-row{display:flex;gap:6px;margin:14px 0 28px;flex-wrap:wrap}
.step-chip{border:1px solid var(--border-solid);background:var(--bg-card);color:var(--text-secondary);font-family:var(--font);font-size:12.5px;padding:6px 12px;border-radius:16px;cursor:pointer;white-space:nowrap;transition:all .15s}
.step-chip:hover{border-color:var(--accent-border);color:var(--accent)}
.step-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.step-chip.done{border-color:var(--accent-border);color:var(--accent)}

.badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-border);padding:4px 10px;border-radius:6px;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.step-title{font-size:clamp(21px,3.4vw,27px);font-weight:700;letter-spacing:-0.6px;margin-bottom:16px}
.content p{line-height:1.7;font-size:15px;color:var(--text-secondary);margin-bottom:14px}
.content strong{color:var(--text);font-weight:700}
.content ul{padding-left:20px;line-height:1.8;font-size:15px;color:var(--text-secondary);margin-bottom:14px}
.content em{font-style:italic}

.info-box{border-left:3px solid var(--accent-amber);background:var(--amber-dim);border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0}
.info-box .info-title{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent-amber);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.info-box p{margin:0 0 8px;font-size:14px;color:var(--text-secondary);line-height:1.65}
.info-box p:last-child{margin-bottom:0}
.info-box--accent{border-left-color:var(--accent);background:var(--accent-dim)}
.info-box--accent .info-title{color:var(--accent)}

/* Demo: karretje met diagrammen eronder */
.demo{background:var(--bg-card);border:1px solid var(--border-solid);border-radius:var(--radius);padding:16px 16px 14px;margin:18px 0}
.demo-titel{font-size:13px;font-weight:700;color:var(--text-secondary);text-align:center;margin-bottom:4px}
.demo-baan{max-width:520px;margin:0 auto}
.demo-grafieken{display:grid;gap:10px;margin:8px 0 12px}
.demo-grafieken.n1{grid-template-columns:1fr;max-width:460px;margin-left:auto;margin-right:auto}
.demo-grafieken.n2{grid-template-columns:1fr 1fr}
.demo-grafieken.n3{grid-template-columns:1fr 1fr 1fr}
.demo-markeer{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.demo-markeer button{font-family:var(--font);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:16px;border:1px solid var(--amber-border);background:transparent;color:var(--accent-amber);cursor:pointer}
.demo-markeer button.aan{background:var(--accent-amber);border-color:var(--accent-amber);color:#fff}
.demo-paar{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.demo-paar .demo{margin:0}

.table-wrap{overflow-x:auto;margin:16px 0}
table.vorm{width:100%;border-collapse:collapse;font-size:14px}
table.vorm th,table.vorm td{border:1px solid var(--border-solid);padding:9px 12px;text-align:left;vertical-align:top}
table.vorm th{background:var(--accent-dim);color:var(--accent);font-size:13.5px;font-weight:700}
table.vorm td{color:var(--text-secondary);background:var(--bg-card)}
table.vorm td:first-child{font-weight:700;color:var(--text)}

/* Probeer het zelf: één vraag aan het eind van een stap */
.zelf{background:var(--bg-card);border:1px solid var(--accent-border);border-radius:var(--radius);padding:18px 18px 16px;margin:26px 0 6px}
.zelf-kop{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:4px}
.zelf-vraag{font-size:15px;font-weight:700;margin-bottom:2px}
.zelf-hint{font-size:13px;color:var(--accent-amber);font-weight:600}
.zelf-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(200px,1fr);gap:16px;align-items:center;margin-top:8px}
.zelf-knoppen{display:grid;grid-template-columns:1fr;gap:7px}
.zelf-knoppen button{font-family:var(--font);font-size:14px;font-weight:700;text-align:left;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border-solid);background:var(--bg-card);color:var(--text);cursor:pointer;transition:all .15s}
.zelf-knoppen button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-dim)}
.zelf-knoppen button:disabled{cursor:default}
.zelf-knoppen button.goed{border-color:#16a34a;background:rgba(22,163,74,0.1);color:#16a34a}
.zelf-knoppen button.fout{border-color:#ef4444;background:rgba(220,38,38,0.08);color:#ef4444}
.zelf-uitleg{font-size:14px;line-height:1.6;color:var(--text-secondary);margin-top:12px;display:none}
.zelf-uitleg.show{display:block}
.zelf-uitleg b{color:var(--text)}
.zelf-nog{display:flex;justify-content:flex-end;margin-top:12px}
.zelf-nog .nav-btn{font-size:13px;padding:8px 14px}
@media(max-width:760px){.zelf-body{grid-template-columns:1fr}}

.cta-card{background:var(--bg-card);border:1px solid var(--accent-border);border-radius:12px;padding:22px 24px;margin-top:22px;text-align:center}
.cta-card h3{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-card p{font-size:14px;color:var(--text-secondary);margin-bottom:16px}
.cta-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;text-decoration:none;transition:all .2s}
.cta-btn:hover{background:#0999aa;box-shadow:0 0 20px var(--accent-glow)}

.nav-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:34px;padding-top:20px;border-top:1px solid var(--border-solid)}
.nav-btn{font-family:var(--font);font-size:14px;font-weight:700;padding:11px 20px;border-radius:10px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.nav-btn:hover:not(:disabled){background:#0999aa}
.nav-btn.secondary{background:transparent;color:var(--accent)}
.nav-btn.secondary:hover:not(:disabled){background:var(--accent-dim)}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-tel{font-family:var(--mono);font-size:12px;color:var(--text-muted)}

footer{text-align:center;padding:32px 0;border-top:1px solid var(--border);font-family:var(--mono);font-size:12px;color:var(--text-muted);margin-top:40px;position:relative;z-index:1}

@media(max-width:560px){
  .app-title,.header-left .crumb-sep:first-of-type{display:none}
}
@media(max-width:760px){
  .app-header{padding:0 12px}
  .main{padding:20px 12px 60px}
  .tool-name{padding-top:24px}
  .demo-grafieken.n2,.demo-grafieken.n3,.demo-paar{grid-template-columns:1fr}
  .demo{padding:12px 8px}
}

<script>
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const logo=document.querySelector('.header-logo'),fl=document.querySelector('.footer-logo'),
        btn=document.getElementById('theme-btn'),fav=document.getElementById('favicon');
  if(t==='dark'){
    if(logo)logo.src='/assets/logo/JK_dark.svg';if(fl)fl.src='/assets/logo/JK_white.svg';
    if(fav)fav.href='/assets/logo/JK_dark.svg';if(btn)btn.textContent='☀️';
  }else{
    if(logo)logo.src='/assets/logo/JK_light.svg';if(fl)fl.src='/assets/logo/JK_black.svg';
    if(fav)fav.href='/assets/logo/JK_light.svg';if(btn)btn.textContent='🌙';
  }
}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme')||'light',n=c==='dark'?'light':'dark';localStorage.setItem('nh-theme',n);applyTheme(n);}
(function(){const s=localStorage.getItem('nh-theme');if(s)applyTheme(s);else if(window.matchMedia('(prefers-color-scheme: dark)').matches)applyTheme('dark');else applyTheme('light');})();


/* ══ STAPPEN ══
   Elke stap: id (voor links vanuit het oefenen), chip, titel, html.
   In de html staat <div data-demo="naam"></div> waar een demo komt; de
   demo's staan in DEMOS met segmenten [duur, vBegin, vEind]. */

const STAPPEN={
onderbouw:[
{id:'intro', chip:'Het karretje', titel:'Een beweging in een diagram', html:`
<p>Een karretje rijdt over een rechte baan. Bij de <strong>startvlag</strong> begint het. Terwijl het rijdt, houden we twee dingen bij:</p>
<ul>
<li>hoe ver het karretje van de start is: de <strong>afstand</strong>;</li>
<li>hoe snel het op dat moment gaat: de <strong>snelheid</strong>.</li>
</ul>
<p>Die twee zet je uit tegen de tijd. Zo krijg je twee diagrammen van dezelfde beweging: een <strong>afstand-tijddiagram</strong> en een <strong>snelheid-tijddiagram</strong>. Druk op afspelen en kijk hoe de lijnen meelopen met het karretje.</p>
<div data-demo="intro"></div>
<div class="info-box info-box--accent"><div class="info-title">Let op de stippen</div>
<p>Elke halve seconde laat het karretje een stip achter op de baan. Liggen de stippen ver uit elkaar, dan gaat het karretje snel. Liggen ze dicht op elkaar, dan gaat het langzaam.</p></div>`},

{id:'stil', chip:'Stilstand', titel:'Stilstand', html:`
<p>In het stuk in amber staat het karretje stil. De afstand tot de start verandert niet, en de snelheid is nul.</p>
<div data-demo="stil"></div>
<ul>
<li><strong>Afstand-tijddiagram:</strong> een horizontale lijn. De afstand blijft gelijk.</li>
<li><strong>Snelheid-tijddiagram:</strong> een lijn óp nul. De snelheid is nul.</li>
</ul>
<p>Alle stippen uit dit stuk liggen op dezelfde plek.</p>`},

{id:'constant', chip:'Constante snelheid', titel:'Constante snelheid', html:`
<p>Het karretje rijdt, en het gaat steeds even snel. Elke seconde komt er evenveel afstand bij.</p>
<div data-demo="constant"></div>
<ul>
<li><strong>Afstand-tijddiagram:</strong> een rechte, schuine lijn. Elke seconde gaat de lijn evenveel omhoog.</li>
<li><strong>Snelheid-tijddiagram:</strong> een horizontale lijn, maar niet op nul. De snelheid blijft gelijk.</li>
</ul>
<div class="info-box"><div class="info-title">Steil is snel</div>
<p>Hoe steiler de lijn in het afstand-tijddiagram, hoe groter de snelheid. In het snelheid-tijddiagram is het makkelijker: daar is de hoogte van de lijn de snelheid zelf.</p></div>`},

{id:'versnellen', chip:'Versnellen', titel:'Versnellen', html:`
<p>Het karretje gaat steeds sneller. Elke seconde komt er meer afstand bij dan de seconde ervoor.</p>
<div data-demo="versnellen"></div>
<ul>
<li><strong>Afstand-tijddiagram:</strong> een kromme lijn die steeds <strong>steiler</strong> wordt.</li>
<li><strong>Snelheid-tijddiagram:</strong> een lijn die stijgt. De snelheid wordt groter.</li>
</ul>
<p>Kijk naar de stippen: ze komen steeds verder uit elkaar te liggen.</p>
<p>Hier komt er elke seconde evenveel snelheid bij. Daarom is de lijn in het snelheid-tijddiagram recht.</p>`},

{id:'vertragen', chip:'Vertragen', titel:'Vertragen', html:`
<p>Het karretje remt af: het gaat steeds langzamer. Elke seconde komt er minder afstand bij.</p>
<div data-demo="vertragen"></div>
<ul>
<li><strong>Afstand-tijddiagram:</strong> een kromme lijn die steeds <strong>vlakker</strong> wordt.</li>
<li><strong>Snelheid-tijddiagram:</strong> een lijn die daalt. De snelheid wordt kleiner.</li>
</ul>
<p>De stippen komen steeds dichter bij elkaar te liggen.</p>
<p>Hier gaat er elke seconde evenveel snelheid af. Daarom is de lijn in het snelheid-tijddiagram recht.</p>`},

{id:'zelfdevorm', chip:'Zelfde vorm', titel:'Zelfde vorm, ander diagram', html:`
<p>Hier gaan de meeste fouten. Een lijn die er hetzelfde uitziet, betekent in het ene diagram iets heel anders dan in het andere. Hieronder twee horizontale lijnen:</p>
<div data-demo="vormA"></div>
<p>Links staat het karretje stil. Rechts rijdt het met constante snelheid. Kijk dus <strong>altijd eerst naar de as</strong>.</p>
<div class="table-wrap"><table class="vorm">
<tr><th>De lijn is…</th><th>Afstand-tijddiagram</th><th>Snelheid-tijddiagram</th></tr>
<tr><td>horizontaal</td><td>stilstand</td><td>constante snelheid (of stilstand als de lijn op nul ligt)</td></tr>
<tr><td>recht en stijgend</td><td>constante snelheid</td><td>versnellen</td></tr>
<tr><td>recht en dalend</td><td>komt hier niet voor: het karretje rijdt alleen vooruit</td><td>vertragen</td></tr>
<tr><td>krom, steeds steiler</td><td>versnellen</td><td>komt niet voor bij deze oefeningen</td></tr>
<tr><td>krom, steeds vlakker</td><td>vertragen</td><td>komt niet voor bij deze oefeningen</td></tr>
</table></div>`},

{id:'getallen', chip:'Rekenen', titel:'Rekenen met een diagram', html:`
<p>Staan er getallen bij de assen, dan kun je meer dan alleen de soort beweging zien. Drie dingen kun je doen:</p>
<ul>

function bouwZelf(houder, spec){
  let vorige=null;
  houder.className='zelf';
  function nieuweVraag(){
    let vraag=null;
    for(let k=0;k<20 && !vraag;k++){
      const vast=Object.assign({}, spec.vast||{});
      if(spec.uit){
        // Niet twee keer achter elkaar hetzelfde antwoord.
        const keuze=spec.uit.filter(x=>!vorige || x!==vorige.soort);
        vast.doel=keuze[Math.floor(Math.random()*keuze.length)];
      }
      vraag=maakVraag(spoor, spec.level, {vast, vorige});
    }
    vorige=vraag;
    houder.innerHTML='<div class="zelf-kop">PROBEER HET ZELF</div>'+
      '<div class="zelf-vraag">Wat doet het karretje in het gemarkeerde stuk?</div>'+
      '<div class="zelf-body"><div class="zelf-grafiek"></div><div class="zelf-knoppen">'+
      SOORTEN.map(x=>'<button data-soort="'+x+'">'+SOORT_NAAM[x]+'</button>').join('')+
      '</div></div><div class="zelf-uitleg"></div>'+
      '<div class="zelf-nog"><button class="nav-btn secondary">Nog een vraag ↻</button></div>';
    maakGrafiek(houder.querySelector('.zelf-grafiek'), vraag.beweging, {diagram:vraag.diagram, spoor, markeer:vraag.index, klein:true});
    houder.querySelector('.zelf-nog button').onclick=nieuweVraag;
    houder.querySelectorAll('.zelf-knoppen button').forEach(b=>{
      b.onclick=()=>{
        const gekozen=b.dataset.soort, goed=vraag.goed.includes(gekozen);
        houder.querySelectorAll('.zelf-knoppen button').forEach(k=>{
          k.disabled=true;
          if(vraag.goed.includes(k.dataset.soort)) k.classList.add('goed');
          else if(k===b) k.classList.add('fout');
        });
        const d=diagnose(vraag,gekozen);
        // Een richtingsfout legt zelf al uit wat er gebeurt (zoals bij het oefenen).
        const alleenDiag=d && d.code==='richting' && vraag.diagram!=='a';
        const u=houder.querySelector('.zelf-uitleg');
        u.innerHTML=goed ? '<b>Goed.</b> '+uitlegTekst(vraag)
          : '<b>Niet goed.</b> '+(alleenDiag ? d.tekst : (d&&d.tekst?d.tekst+' ':'')+uitlegTekst(vraag));
        u.classList.add('show');
      };
    });
  }
  nieuweVraag();
}

const el=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let spoor=params.get('niveau')==='bovenbouw'?'bovenbouw':'onderbouw';
let huidig=0, scenes=[];

function bouwDemo(houder, d, metTitel){
  const b=bouwBeweging(d.segs, d.x0||0);
  const n=d.diagrammen.length;
  houder.className='demo';
  houder.innerHTML=(metTitel?'<div class="demo-titel">'+d.titel+'</div>':'')+
    (d.keuzes?'<div class="demo-markeer">'+d.keuzes.map(([t,i],k)=>'<button data-i="'+i+'" class="'+(k===0?'aan':'')+'">'+t+'</button>').join('')+'</div>':'')+
    '<div class="demo-baan"></div><div class="demo-grafieken n'+n+'">'+
    d.diagrammen.map(()=>'<div><div class="g"></div></div>').join('')+'</div>'+
    '<div class="bg-speel"><button class="vol">▶ Afspelen</button><button>Langzaam</button></div>';
  const scene=maakScene({
    karretje:houder.querySelector('.demo-baan'),
    grafieken:[...houder.querySelectorAll('.g')].map((g,i)=>({houder:g, diagram:d.diagrammen[i]})),
    beweging:b, spoor, markeer:d.markeer, klein:n>1, getallen:!!d.getallen
  });
  const [speel,langzaam]=houder.querySelectorAll('.bg-speel button');
  speel.onclick=()=>scene.speel('normaal');
  langzaam.onclick=()=>scene.speel('langzaam');
  houder.querySelectorAll('.demo-markeer button').forEach(k=>{
    k.onclick=()=>{
      houder.querySelectorAll('.demo-markeer button').forEach(x=>x.classList.toggle('aan',x===k));
      scene.zetMarkering(Number(k.dataset.i));
      scene.speel('normaal');
    };
  });
  scenes.push(scene);
}

function tekenStap(){
  scenes.forEach(s=>s.stop()); scenes=[];
  const lijst=STAPPEN[spoor], s=lijst[huidig];
  el('stap').innerHTML='<span class="badge">Stap '+(huidig+1)+' van '+lijst.length+'</span>'+
    '<h2 class="step-title">'+s.titel+'</h2><div class="content">'+s.html+'</div>';
  el('stap').querySelectorAll('[data-demo]').forEach(h=>{
    const d=DEMOS[spoor][h.dataset.demo];
    if(d.paar){
      h.className='demo-paar';
      h.innerHTML=d.paar.map(()=>'<div></div>').join('');
      [...h.children].forEach((c,i)=>bouwDemo(c,d.paar[i],true));
    } else bouwDemo(h,d,false);
  });
  const zelf=VRAGEN[spoor][s.id];
  if(zelf){
    const h=document.createElement('div');
    el('stap').querySelector('.content').appendChild(h);
    bouwZelf(h, zelf);
  }
  el('chips').innerHTML=lijst.map((x,i)=>'<button class="step-chip'+(i===huidig?' active':(i<huidig?' done':''))+'" data-i="'+i+'">'+x.chip+'</button>').join('');
  el('chips').querySelectorAll('.step-chip').forEach(c=>c.onclick=()=>gaNaar(Number(c.dataset.i)));
  el('progress').style.width=((huidig+1)/lijst.length*100)+'%';
  el('vorige').disabled=huidig===0;
  el('volgende').disabled=huidig===lijst.length-1;
  el('nav-tel').textContent=(huidig+1)+' / '+lijst.length;
  document.querySelectorAll('.spoor-btn').forEach(b=>{
    const aan=b.dataset.spoor===spoor;
    b.classList.toggle('active',aan); b.setAttribute('aria-selected',String(aan));
  });
  el('tool-sub').textContent='Uitleg · '+spoor;
  el('crumb-tool').href='../#'+spoor;
  const u=new URL(location.href);
  u.searchParams.set('niveau',spoor); u.searchParams.set('stap',s.id);
  history.replaceState(null,'',u);
}

function gaNaar(i){
  const n=STAPPEN[spoor].length;
  huidig=Math.max(0,Math.min(n-1,i));
  tekenStap();
  window.scrollTo({top:0,behavior:'smooth'});
}

el('vorige').onclick=()=>gaNaar(huidig-1);
el('volgende').onclick=()=>gaNaar(huidig+1);
document.querySelectorAll('.spoor-btn').forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.spoor===spoor) return;
    const id=STAPPEN[spoor][huidig].id;
    spoor=b.dataset.spoor;
    const j=STAPPEN[spoor].findIndex(x=>x.id===id);
    huidig=j>=0?j:0;
    tekenStap();
  };
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')) return;
  if(e.key==='ArrowRight') gaNaar(huidig+1);
  else if(e.key==='ArrowLeft') gaNaar(huidig-1);
});

// ?stap=… opent meteen de goede stap (links vanuit het oefenen).
const start=STAPPEN[spoor].findIndex(x=>x.id===params.get('stap'));
huidig=start>=0?start:0;
tekenStap();
</script>
</body>
</html>
