<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natuurkundig modelleren · NatuurkundeHub</title>
    <meta name="description" content="Bouw numerieke modellen voor natuurkunde, laat ze stap voor stap doorrekenen en bekijk het resultaat in grafieken. Met begeleide oefeningen.">
    <link rel="canonical" href="https://natuurkundehub.nl/modelleren/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NatuurkundeHub">
    <meta property="og:locale" content="nl_NL">
    <meta property="og:title" content="Natuurkundig modelleren">
    <meta property="og:description" content="Bouw numerieke modellen voor natuurkunde, laat ze stap voor stap doorrekenen en bekijk het resultaat in grafieken. Met begeleide oefeningen.">
    <meta property="og:url" content="https://natuurkundehub.nl/modelleren/">
    <link rel="icon" type="image/svg+xml" href="../assets/logo/JK_light.svg" id="favicon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // nh-theme toepassen vóór render om FOUC te voorkomen.
      (function () {
        try {
          const saved = localStorage.getItem("nh-theme");
          const prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = saved ? saved : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          const favicon = document.getElementById("favicon");
          if (favicon) {
            favicon.href =
              theme === "dark" ? "../assets/logo/JK_dark.svg" : "../assets/logo/JK_light.svg";
          }
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
